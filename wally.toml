[package]
name = "griffin-dalby/carrot"
version = "0.2.3" # x-release-please-version
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

include = [
    "wally.toml",
    "default.project.json",
]

exclude = [
    "DevPackages/*",
    ".github/*",
    "node_modules",
    "build",
    "tests",

    "*.spec.luau",
    "**.json",

    "moonwave.toml",
    "rokit.toml",
    "README.md",
    
    "src/.jest-roblox",
    "src/__tests__",
    "src/jest.config.luau"
]

[dev-dependencies]
Jest = "roblox/jest@^3.20.0"
JestGlobals = "roblox/jest-globals@^3.20.0"

[dependencies]
