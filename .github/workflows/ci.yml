name: ci
concurrency: jest-open-cloud

on:
  pull_request:
  workflow_call:

jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.2.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      
      - run: npm install --save-dev @isentinel/jest-roblox
      - run: wally install

      - name: Build file
        run: rojo build -o game.rbxl

      - run: |
          npx jest-roblox-cli --backend open-cloud --project carrot --placeId ${{ secrets.ROBLOX_PLACE_ID }} --universeId ${{ secrets.ROBLOX_UNIVERSE_ID }}
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}