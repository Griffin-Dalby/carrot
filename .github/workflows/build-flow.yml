name: publish-artifact
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
    
jobs:
  release-please:
    runs-on: ubuntu-latest
    name: Release Please

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
  
  rojo-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    runs-on: ubuntu-latest
    name: Publish rojo artifact to release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Build Project
        run: |
          rojo build build.project.json --output "project-${{ needs.release-please.outputs.tag_name }}.rbxm"

      - name: Upload Binary to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} project-*.rbxm

  wally-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    runs-on: ubuntu-latest
    name: Publish latest to wally
    env:
      WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Login
        run: wally login --token "$WALLY_AUTH_TOKEN"
      
      - name: Publish
        run: wally publish

  moonwave-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    runs-on: ubuntu-latest
    name: Publish docs to GitHub Pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g moonwave@v1.4.2
      - name: Publish
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git config --global user.email "support+actions@github.com"
          git config --global user.name "github-actions-bot"
          moonwave build --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}