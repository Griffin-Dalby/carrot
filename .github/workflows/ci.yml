name: ci
concurrency: jest-open-cloud

on:
  pull_request:
  workflow_call:

jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.2.1

      - run: |
          jest-roblox-cli --backend open-cloud --project carrot --placeId "${{ secrets.ROBLOX_PLACE_ID }}" --universeId "${{ secrets.ROBLOX_UNIVERSE_ID }}"
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}