[package]
name = "griffin-dalby/carrot"
version = "0.2.1" # x-release-please-version
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

include = [
    "wally.toml",
    "default.project.json",
]

exclude = [
    "DevPackages/*",
    ".github/*",
    "node_modules",
    "build",
    "tests",

    "*.spec.luau",
    "**.json",

    "moonwave.toml",
    "rokit.toml",
    "README.md",
    
    "src/__tests__",
    "src/jest.config.luau"
]

[dev-dependencies]
Jest = "jsdotlua/jest@3.10.0"
JestGlobals = "jsdotlua/jest-globals@3.10.0"

